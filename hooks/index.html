<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kenetik · TikTok Hook Library</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#16161D;--ink2:#5A5B66;--muted:#9A9BA6;--berry:#D0148C;--violet:#7A2BD0;--blue:#2E6BE6;--plum:#1E1230;--panel:#F5F6F8;--line:#E6E6EA;--amberbg:#FDEEE0;--amberbd:#F5821F;--bad:#E0322B;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Futura','Century Gothic','Trebuchet MS','Segoe UI',sans-serif;color:var(--ink);background:#fff;}
.wrap{display:flex;min-height:100vh;}
.side{width:262px;flex:0 0 262px;background:var(--plum);color:#fff;position:sticky;top:0;height:100vh;overflow-y:auto;padding:0 0 24px;}
.brand{padding:22px 20px 6px;font-weight:800;letter-spacing:3px;font-size:20px;}
.brand small{display:block;letter-spacing:2px;font-size:10px;font-weight:400;color:#CFCBDA;margin-top:4px;}
.hint{display:none;}
.backlink{display:inline-block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#E9E4F2;font-weight:700;margin-bottom:14px;text-decoration:none;padding:6px 12px;border:1px solid rgba(208,20,140,.55);border-radius:999px;background:rgba(208,20,140,.12);transition:background .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease;}
.backlink:hover{background:#D0148C;border-color:#D0148C;color:#fff;box-shadow:0 2px 10px rgba(208,20,140,.35);}
.backlink:active{transform:translateY(1px);}
.brand .wordmark{color:#fff;text-decoration:none;display:block;line-height:1;}
.stripe{height:4px;background:linear-gradient(90deg,var(--berry) 0 33%,var(--violet) 33% 66%,var(--blue) 66% 100%);margin:12px 0 8px;}
.tab{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:#CFCBDA;font:inherit;font-size:13.5px;padding:11px 18px;cursor:pointer;}
.tab:hover{color:#fff;background:rgba(255,255,255,.05);}
.tab.active{color:#fff;font-weight:700;border-left-color:var(--berry);background:rgba(208,20,140,.14);}

.strip{height:5px;width:100%;background:linear-gradient(90deg,var(--berry) 0 33%,var(--violet) 33% 66%,var(--blue) 66% 100%);border-radius:2px;margin-bottom:16px;}

@media(max-width:760px){.wrap{flex-direction:column;}.side{position:sticky;top:0;z-index:30;flex:0 0 auto;width:100%;height:auto;overflow:visible;padding:0 0 6px;box-shadow:0 3px 10px rgba(0,0,0,.18);}.brand{padding:10px 16px 2px;font-size:15px;letter-spacing:2px;}.brand small{font-size:8px;margin-top:2px;}.stripe{margin:6px 0 0;}.tabs{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}.tabs::-webkit-scrollbar{display:none;}.tab{flex:0 0 auto;width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:11px 15px;}.tab:hover{background:none;}.tab.active{border-left:0;border-bottom-color:var(--berry);background:rgba(208,20,140,.16);}.tab em{margin-left:5px;}
.tab span>*{}
.main{padding:20px 18px 50px;width:100%;max-width:100%;margin:0;align-self:stretch;}.hint{display:block;position:absolute;top:52px;right:16px;font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:#CFCBDA;opacity:.9;z-index:6;}.side::after{content:"›";position:absolute;right:0;bottom:6px;height:46px;width:56px;background:linear-gradient(90deg,rgba(30,18,48,0),var(--plum) 70%);pointer-events:none;z-index:5;color:#CFCBDA;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:flex-end;padding-right:13px;}}

.acard{flex:0 0 224px;min-height:152px;display:flex;flex-direction:column;text-align:left;cursor:pointer;background:#fff;border:1px solid var(--line);border-left:5px solid var(--berry);border-radius:8px;padding:16px 17px;font:inherit;transition:box-shadow .15s ease,transform .1s ease,border-color .15s ease;}

.recap{margin-top:40px;background:linear-gradient(135deg,#FBEAF4,#F1ECFA);border:1px solid var(--line);border-radius:10px;padding:22px 24px;}.recap h3{margin:0 0 9px;font-size:19px;color:var(--ink);letter-spacing:.2px;}.recap p{margin:0;font-size:14.5px;line-height:1.6;color:var(--ink2);}.recap b{color:var(--ink);}.recap p+p{margin-top:12px;}

.sec{scroll-margin-top:20px;padding-top:6px;}
.divider{height:1px;background:var(--line);margin:34px 0 28px;}
.roi{display:inline-block;background:var(--berry);color:#fff;font-weight:800;font-size:12px;letter-spacing:.5px;padding:4px 10px;border-radius:999px;vertical-align:middle;margin-left:8px;}

@media(max-width:760px){.wins{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:11px;}}

.fork{display:flex;gap:14px;margin:2px 0 6px;}

.stamp{display:inline-flex;align-items:center;gap:8px;background:#F1FAF5;border:1px solid #CDEBDC;border-radius:999px;padding:6px 14px;margin:0 0 20px;font-size:12.5px;color:#1F8A5B;font-weight:700;letter-spacing:.2px;}
.stamp i{width:8px;height:8px;border-radius:999px;background:#3FCF8E;box-shadow:0 0 0 4px rgba(63,207,142,.16);flex:0 0 8px;font-style:normal;}
.stamp b{color:#5A5B66;font-weight:400;}

.amber.clickable{cursor:pointer;transition:box-shadow .15s ease,border-color .15s ease,transform .1s ease;}

.amber.clickable:active{transform:translateY(1px);}
.amber .go{display:block;margin-top:10px;font-size:11.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--berry);}

@media(max-width:760px){.backlink{padding:10px 14px;}.brand .wordmark{padding:4px 0;}.stamp{width:100%;justify-content:center;box-sizing:border-box;}}

/* --- Added by the KGS renderer (workplan 7-1). Everything above this line is the live page's
   own stylesheet, spliced in unchanged so the page looks and feels identical. --- */
.hbadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;}
.hbadge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);background:#fff;text-decoration:none;}

<body><div class="wrap">
<nav class="side">
  <div class="brand"><a class="backlink" href="/">← Creator Hub</a><a class="wordmark" href="/">KENETIK</a><small>TIKTOK HOOK LIBRARY</small></div>
  <div class="hint">Swipe for more →</div>
  <div class="stripe"></div>
  <div class="tabs" id="tabs"></div>
</nav>
<main class="main" id="main"><div class="loading">Loading the hooks.</div></main>
</div>
<script>
/* The hooks hub renders one file and holds no copy of its own.

   The content lives in the Kenetik Growth System at data/creator-flywheel/hooks-hub.json and is
   mirrored here as data/hooks-data.json by the publish workflow. Edit it there, never here: a
   hand edit to this page or to that file inside this repository is overwritten on the next
   publish. Everything below draws the file; nothing below decides anything.

   Tab order comes from nav_order, and a panel is addressed by its slug, so inserting or
   reordering a tab can never again point a button at the wrong panel. */

var DATA = null;

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* The store keeps emphasis as **bold**, because emphasis is meaning in this copy. */
function rich(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}

function attr(s){ return esc(s); }

var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function inWords(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  if(!m) return '';
  return String(Number(m[3])) + ' ' + MONTHS[Number(m[2]) - 1] + ' ' + m[1];
}

function isFigure(v){ return typeof v === 'number' && isFinite(v); }

var COUNT_WORDS = ['no','one','two','three','four','five','six','seven','eight','nine','ten',
  'eleven','twelve'];
function inWordsCount(n){ return COUNT_WORDS[n] || String(n); }

/* How long the figures cover, in the page's own words, taken from the window the writer stamped
   on the top hooks block. One window, one sentence: the page never names a period of its own. */
function windowWeeks(){
  var w = (DATA.top_now || {}).window || {};
  var a = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(w.start || ''));
  var b = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(w.end || ''));
  if(!a || !b) return '';
  var days = Math.round((Date.parse(w.end) - Date.parse(w.start)) / 86400000) + 1;
  if(!(days > 0)) return '';
  var weeks = Math.round(days / 7);
  return weeks === 1 ? ' in the last week' : (' in the last ' + inWordsCount(weeks) + ' weeks');
}

/* THE ONE SENTENCE A FIGURE IS ALLOWED TO BE ON THIS PAGE (design direction §7): counts and
   multiples, never dollars. The store carries revenue for the console; nothing here reads it,
   and a test asserts this script never names that field. */
function proofWords(proof){
  var sold = proof.converting_videos;
  if(!isFigure(sold)) return null;
  if(sold === 0) return 'No sales off this line' + windowWeeks();
  var people = isFigure(proof.distinct_creators) && proof.distinct_creators > 0
    ? (' for ' + inWordsCount(proof.distinct_creators)
       + (proof.distinct_creators === 1 ? ' creator' : ' creators'))
    : '';
  return 'Sold ' + sold + (sold === 1 ? ' time' : ' times') + people + windowWeeks();
}

/* A tab may word a line it shares with another tab differently. One line keeps one id and one
   set of figures; the tab's own wording is applied on top of it here. */
function placedHook(tab, id){
  var base = (DATA.hooks || {})[id] || {};
  var row = {};
  for(var k in base){ if(Object.prototype.hasOwnProperty.call(base, k)) row[k] = base[k]; }
  var over = (tab.hook_overrides || {})[id] || {};
  for(var f in over){
    if(!Object.prototype.hasOwnProperty.call(over, f)) continue;
    if(over[f] === null){ delete row[f]; } else { row[f] = over[f]; }
  }
  return row;
}

function metaLine(hook){
  var parts = [];
  ['angle','format','audience'].forEach(function(f){ if(hook[f]) parts.push(rich(hook[f])); });
  (hook.meta_extra || []).forEach(function(part){
    if(part.kind === 'bold'){ parts.push('<b>' + esc(part.text) + '</b>'); }
    else if(part.kind === 'text'){ parts.push(esc(part.text)); }
    else if(part.kind === 'source_link'){
      var src = hook.source || {};
      if(src.link_label){
        parts.push('<a class="hsrc" href="' + attr(src.video_url) + '" target="_blank" rel="noopener">' + esc(src.link_label) + '</a>');
      }
    }
  });
  return parts.join(' &nbsp;&middot;&nbsp; ');
}

/* Two small marks on every line, and both of them are honest.
   A line a creator said carries their name. A line we wrote says so.
   A line no video has carried yet says "not read yet" rather than a zero. */
function badges(hook){
  var src = hook.source || {};
  var proof = hook.proof || {};
  var out = [];
  var words = proofWords(proof);
  if(src.kind === 'quoted'){
    var who = src.creator ? ('Said by ' + src.creator) : 'Said out loud';
    if(src.video_url){
      out.push('<a class="hbadge quoted" href="' + attr(src.video_url) + '" target="_blank" rel="noopener">' + esc(who) + '</a>');
    } else {
      out.push('<span class="hbadge quoted">' + esc(who) + '</span>');
    }
    out.push('<span class="hbadge">' + (words ? esc(words) : 'not read yet') + '</span>');
  } else {
    out.push('<span class="hbadge' + (words ? '' : ' untested') + '">'
      + (words ? esc(words) : 'Untested') + '</span>');
  }
  return '<div class="hbadges">' + out.join('') + '</div>';
}

function pad2(n){ return (n < 10 ? '0' : '') + n; }

function renderHooks(tab, ids){
  var rows = ids.map(function(id, i){
    var hook = placedHook(tab, id);
    var meta = metaLine(hook);
    return '<div class="hook"><div class="hnum">' + pad2(i + 1) + '</div><div class="hbody">'
      + '<div class="htxt">' + rich(hook.text) + '</div>'
      + (meta ? '<div class="hmeta">' + meta + '</div>' : '')
      + badges(hook)
      + (hook.why ? '<div class="hwhy">' + rich(hook.why) + '</div>' : '')
      + '</div></div>';
  });
  return '<div class="hooks">' + rows.join('') + '</div>';
}

function renderFormula(steps){
  return '<div class="formula">' + (steps || []).map(function(step, i){
    return '<div class="step"><span class="sn">' + (i + 1) + '</span><div><b>' + rich(step.title)
      + '</b><p>' + rich(step.text) + '</p></div></div>';
  }).join('') + '</div>';
}

function renderPillar(side, pillar, fallback){
  var body;
  if(pillar && pillar.items){
    body = '<ul>' + pillar.items.map(function(li){ return '<li>' + rich(li) + '</li>'; }).join('') + '</ul>';
  } else if(pillar && typeof pillar.text === 'string'){
    body = '<p>' + rich(pillar.text) + '</p>';
  } else {
    body = '<ul>' + (fallback || []).map(function(li){ return '<li>' + rich(li) + '</li>'; }).join('') + '</ul>';
  }
  return '<div class="pillar ' + side + '"><h4>' + rich((pillar && pillar.heading) || '') + '</h4>' + body + '</div>';
}

function renderWins(items){
  return '<div class="wins">' + (items || []).map(function(w){
    return '<a class="win" href="' + attr(w.url) + '" target="_blank" rel="noopener">'
      + '<img src="' + attr(w.image) + '" alt="' + attr(w.image_alt) + '" loading="lazy">'
      + '<div class="wb"><div class="wtag">' + rich(w.tag) + '</div><div class="wq">' + rich(w.quote) + '</div>'
      + '<div class="wm"><span>' + esc(w.handle) + '</span><b>' + esc(w.figure) + '</b></div>'
      + (w.note ? '<div class="wn">' + esc(w.note) + '</div>' : '')
      + '</div></a>';
  }).join('') + '</div>';
}

function renderFork(options){
  return '<div class="fork">' + (options || []).map(function(o){
    var go = o.target_slug ? ('openSlug(\'' + esc(o.target_slug) + '\')')
      : ('document.getElementById(\'' + esc(o.scroll_to || '') + '\').scrollIntoView({behavior:\'smooth\',block:\'start\'})');
    return '<button' + (o.primary ? ' class="primary"' : '') + ' onclick="' + attr(go) + '">'
      + '<div class="fk">' + rich(o.kicker) + '</div><div class="ft">' + rich(o.title) + '</div>'
      + '<div class="fd">' + rich(o.description) + '</div><div class="fg">' + rich(o.go) + '</div></button>';
  }).join('') + '</div>';
}

function renderPicker(cards){
  return '<div class="arowwrap"><div class="arow">' + (cards || []).map(function(c){
    return '<button class="acard" onclick="' + attr('openSlug(\'' + c.target_slug + '\')') + '">'
      + '<div class="at">' + rich(c.title) + '</div><div class="ad">' + rich(c.description) + '</div>'
      + '<div class="ago">' + rich(c.go) + '</div></button>';
  }).join('') + '</div></div>';
}

/* The Start Here top hooks, written every turn by the machine from what actually sold (N1).
   Drawn on Start Here, which is where every TikTok Shop creator lands, and on the Top 3 tab.
   Until the writer fills the block this draws nothing and both tabs show their own hooks
   exactly as they do today. */
function renderTopNow(tab){
  var top = DATA.top_now || {};
  var rows = top.rows || [];
  if(!rows.length) return '';
  var window_ = top.window || {};
  var items = rows.map(function(r){
    var hook = placedHook(tab, r.hook_id);
    var figure = proofWords({converting_videos: r.converting_videos,
                             distinct_creators: r.creators}) || 'not read yet';
    return '<li><b>' + rich(hook.text || r.hook_id) + '</b> ' + esc(figure) + '</li>';
  });
  return '<div class="eyebrow">Converting best right now</div>'
    + '<ul class="run">' + items.join('') + '</ul>'
    + '<p class="pk">' + esc(top.how || '') + (window_.start && window_.start !== 'UNKNOWN'
        ? esc(' Counted from ' + inWords(window_.start) + ' to ' + inWords(window_.end) + '.') : '') + '</p>';
}

function renderBlocks(tab, blocks){
  return (blocks || []).map(function(b){
    switch(b.block){
      case 'section':
        return '<div class="sec"' + (b.id ? ' id="' + attr(b.id) + '"' : '') + '>' + renderBlocks(tab, b.blocks) + '</div>';
      case 'heading':
        return '<h1>' + rich(b.title != null ? b.title : tab.title)
          + (b.roi ? ' <span class="roi">' + esc(b.roi) + '</span>' : '') + '</h1>';
      case 'sub':
        return '<div class="sub">' + rich(b.text != null ? b.text : tab.sub) + '</div>';
      case 'eyebrow':
        return '<div class="eyebrow"' + (b.id ? ' id="' + attr(b.id) + '"' : '') + '>' + rich(b.text) + '</div>';
      case 'northstar':
        return '<div class="northstar"><p>' + rich(b.text != null ? b.text : tab.audience) + '</p></div>';
      case 'formula':
        return renderFormula(b.steps != null ? b.steps : tab.formula);
      case 'hooks':
        return renderHooks(tab, b.hook_ids || []);
      case 'twocol':
        return '<div class="twocol">' + renderPillar('pos', b.pos, tab.dos) + renderPillar('neg', b.neg, tab.donts) + '</div>';
      case 'amber': {
        /* A clickable callout is reachable by keyboard as well as by pointer, the way the page
           already does it: a role, a tab stop, and Enter or Space opening the same tab. */
        var open = b.target_slug ? attr('openSlug(\'' + b.target_slug + '\')') : '';
        var head = b.target_slug
          ? '<div class="amber clickable" role="button" tabindex="0" onclick="' + open
            + '" onkeydown="' + attr("if(event.key==='Enter'||event.key===' '){event.preventDefault();")
            + open + attr('}') + '">'
          : '<div class="amber">';
        return head + '<div class="amber-label">' + rich(b.label) + '</div><p>' + rich(b.text) + '</p>'
          + (b.go ? '<span class="go">' + rich(b.go) + '</span>' : '') + '</div>';
      }
      case 'stamp':
        return '<div class="stamp"><i></i>' + rich(b.text) + (b.note ? ' <b>' + rich(b.note) + '</b>' : '') + '</div>';
      case 'wins':
        return renderWins(b.items);
      case 'fork':
        return renderFork(b.options);
      case 'picker':
        return renderPicker(b.cards);
      case 'recap':
        return '<div class="recap"><h3>' + rich(b.heading) + '</h3>'
          + (b.paragraphs || []).map(function(p){ return '<p>' + rich(p) + '</p>'; }).join('') + '</div>';
      case 'note':
        return '<p class="' + attr(b.style || 'pk') + '">' + rich(b.text) + '</p>';
      case 'list':
        return '<ul class="run">' + (b.items || []).map(function(li){ return '<li>' + rich(li) + '</li>'; }).join('') + '</ul>';
      case 'divider':
        return '<div class="divider"></div>';
      case 'foot':
        return '';
      default:
        return '';
    }
  }).join('');
}

function renderFoot(){
  var pending = (DATA.changes_pending || []).length;
  var updated = inWords(DATA.updated);
  return '<div class="foot">' + rich(DATA.footer || '')
    + (updated ? ' Updated ' + esc(updated) + '.' : '')
    + (pending ? '<div class="pending">' + esc(pending + (pending === 1 ? ' change' : ' changes') + ' waiting on Nick') + '</div>' : '')
    + '</div>';
}

function layoutFor(tab){
  if(tab.layout_from === 'start_here'){ return (DATA.start_here || {}).layout || []; }
  return tab.layout || [];
}

function render(){
  var tabs = (DATA.tabs || []).slice().sort(function(a, b){ return a.nav_order - b.nav_order; });
  document.getElementById('tabs').innerHTML = tabs.map(function(t, i){
    return '<button class="tab' + (i === 0 ? ' active' : '') + '" onclick="' + attr('showTab(' + i + ',\'' + t.slug + '\')')
      + '" id="tab' + i + '"><span>' + esc(t.label) + '</span><em></em></button>';
  }).join('');
  document.getElementById('main').innerHTML = tabs.map(function(t, i){
    var topNow = (t.slug === 'top-3' || t.slug === 'start-here') ? renderTopNow(t) : '';
    var body = topNow + renderBlocks(t, layoutFor(t)) + renderFoot();
    return '<section class="panel' + (i === 0 ? ' show' : '') + '" id="panel' + i + '" data-slug="' + attr(t.slug) + '">'
      + '<div class="strip"></div>' + body + '</section>';
  }).join('');
}

function showTab(i, slug){
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('show'); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  var panel = document.getElementById('panel' + i);
  var button = document.getElementById('tab' + i);
  if(panel) panel.classList.add('show');
  if(button) button.classList.add('active');
  if(slug){ history.replaceState(null, '', '#' + slug); }
  if(button && button.scrollIntoView){ button.scrollIntoView({inline:'center', block:'nearest'}); }
  window.scrollTo(0, 0);
}

function openSlug(slug){
  var panels = document.querySelectorAll('.panel');
  for(var i = 0; i < panels.length; i++){
    if(panels[i].getAttribute('data-slug') === slug){ showTab(i, slug); return; }
  }
}

function openFromHash(){
  var h = (location.hash || '').replace('#', '').toLowerCase();
  if(!h) return;
  openSlug(h);
}

function nudgeTabs(){
  if(location.hash) return;
  if(!(window.matchMedia && window.matchMedia('(max-width:760px)').matches)) return;
  var t = document.querySelector('.tabs');
  if(!t || t.scrollWidth <= t.clientWidth + 8) return;
  setTimeout(function(){
    t.scrollTo({left:72, behavior:'smooth'});
    setTimeout(function(){ t.scrollTo({left:0, behavior:'smooth'}); }, 620);
  }, 550);
}

fetch('../data/hooks-data.json', {cache:'no-cache'})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(json){
    DATA = json;
    render();
    openFromHash();
    nudgeTabs();
    window.addEventListener('hashchange', openFromHash);
  })
  .catch(function(){
    document.getElementById('main').innerHTML =
      '<div class="loading">The hooks did not load. Refresh the page, and if it keeps happening tell Nick.</div>';
  });
</script>
</body></html>
