<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kenetik · TikTok Hook Library</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a gradient brand band, one row of four destinations, then a single reading column.
   Colors follow the new drinkkenetik.com: a plum-to-sky gradient and an orange-to-gold action. */
:root{
  --ink:#14121C;--ink2:#4F4C5C;--muted:#8D8A99;--line:#E7E4EE;--panel:#F6F4FA;--white:#fff;
  --plum:#7B2A86;--violet:#5A3E9E;--royal:#3557B7;--sky:#2A9AD3;
  --orange:#E5431F;--gold:#F7B526;--bad:#D93A2B;--ok:#1F8A5B;
  --grad:linear-gradient(90deg,#7B2A86 0%,#5A3E9E 30%,#3557B7 62%,#2A9AD3 100%);
  --cta:linear-gradient(90deg,#E5431F 0%,#F28A22 60%,#F7B526 100%);
  --display:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  --text:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto;}*{transition:none!important;}}
body{margin:0;font-family:var(--text);color:var(--ink);background:var(--white);-webkit-font-smoothing:antialiased;}
a{color:inherit;}
button{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px;}

/* brand band */
.band{background:var(--grad);color:#fff;}
.band-in{max-width:1160px;margin:0 auto;padding:16px 40px 14px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.wordmark{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:4px;color:#fff;text-decoration:none;}
.band small{display:block;font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.85;margin-top:2px;font-weight:600;}
.backlink{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.6px;color:#fff;text-decoration:none;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);}
.backlink:hover{background:rgba(255,255,255,.28);}

/* the four destinations */
.nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--line);}
.tabs{max-width:1160px;margin:0 auto;padding:10px 40px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;}
.tab:hover{color:var(--ink);border-color:#CFC8DE;}
.tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.tab em{display:none;}
a.tab{text-decoration:none;} .tab.tab-link{color:var(--plum);border-color:var(--plum);}
.hint{display:none;}

/* reading column */
.main{max-width:1160px;margin:0 auto;padding:36px 40px 80px;}
/* one shared width: band, nav and content start on the same edge */

.panel{display:none;} .panel.show{display:block;}
.strip{display:none;}
.crumb{display:inline-block;margin:0 0 14px;font-size:13px;font-weight:700;color:var(--royal);cursor:pointer;background:none;border:0;padding:0;}
.crumb:hover{text-decoration:underline;}
h1{font-family:var(--display);font-weight:900;font-size:40px;line-height:1.05;letter-spacing:-.8px;margin:0 0 10px;text-wrap:balance;}
.sec h1{font-size:30px;letter-spacing:-.5px;}
.sub{color:var(--ink2);font-size:16.5px;line-height:1.5;margin-bottom:10px;}
.eyebrow{font-family:var(--display);color:var(--violet);font-weight:800;font-size:13px;letter-spacing:1.8px;text-transform:uppercase;margin:40px 0 12px;}
.northstar{background:var(--panel);padding:16px 20px;border-radius:14px;}
/* the one big statement above a section's detail, in the display face (the creator pages' look) */
.bigline{font-family:var(--display);font-size:32px;line-height:1.2;font-weight:800;letter-spacing:-.6px;color:var(--ink);margin:0 0 14px;}
.bigline b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.northstar p{margin:0;font-size:16px;line-height:1.6;color:var(--ink2);} .northstar b{color:var(--ink);}
.amber{background:#FFF6EA;border:1px solid #F9DDB5;padding:13px 18px;border-radius:14px;margin-top:14px;}
.amber-label{color:#B4500F;font-weight:800;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;margin-bottom:5px;}
.amber p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink2);} .amber b{color:var(--ink);}

/* hooks */
.hooks{display:flex;flex-direction:column;gap:10px;}
.hook{display:flex;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:#fff;}
.hnum{flex:0 0 32px;font-family:var(--display);font-weight:900;font-size:22px;line-height:1.2;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.htxt{font-size:16.5px;font-weight:700;line-height:1.42;color:var(--ink);}
.hmeta{font-size:13.5px;color:var(--ink2);margin-top:6px;line-height:1.5;}
.hsrc{font-weight:700;color:var(--royal);text-decoration:none;border-bottom:1px solid rgba(53,87,183,.35);}
.hwhy{font-size:13.5px;line-height:1.55;color:var(--ink2);margin-top:8px;padding-left:11px;border-left:2px solid var(--line);}
.hbadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.hbadge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 10px;border-radius:999px;background:var(--panel);color:var(--ink2);text-decoration:none;}
.hbadge.quoted{background:#EAF3FB;color:var(--royal);}
.hbadge.untested{color:var(--muted);}
.hprompt{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;color:#C2410C;letter-spacing:.2px;}
.hprompt:before{content:"\2192";margin-right:5px;}

/* lists, steps, do and don't */
ul.run{list-style:none;padding:0;margin:6px 0 0;}
ul.run li{position:relative;padding:6px 0 6px 20px;font-size:14.5px;line-height:1.5;color:var(--ink2);}
ul.run li:before{content:"";position:absolute;left:3px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--sky);}
ul.run b{color:var(--ink);}
.formula{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
.step{display:flex;gap:14px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid var(--line);}
.step:last-child{border-bottom:0;}
.step .sn{flex:0 0 28px;height:28px;border-radius:50%;background:var(--grad);color:#fff;font-family:var(--display);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
.step b{font-size:15px;color:var(--ink);}
.step p{margin:3px 0 0;font-size:14.5px;line-height:1.5;color:var(--ink2);}
details.howto{margin-top:34px;border:1px solid var(--line);border-radius:14px;padding:4px 18px;}
details.howto summary{cursor:pointer;list-style:none;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:1.8px;text-transform:uppercase;color:var(--violet);padding:12px 0;}
details.howto summary::-webkit-details-marker{display:none;}
details.howto summary:after{content:"+";float:right;font-size:18px;line-height:1;}
details.howto[open] summary:after{content:"\2212";}
.twocol{display:flex;gap:14px;align-items:stretch;}
.pillar{flex:1 1 0;min-width:0;border-radius:14px;padding:16px 18px;border:1px solid var(--line);}
.pillar h4{margin:0 0 8px;font-family:var(--display);font-size:13px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;}
.pillar p{margin:0;font-size:14.5px;line-height:1.5;color:var(--ink2);}
.pillar.pos h4{color:var(--ok);} .pillar.neg h4{color:var(--bad);}
.pillar ul{list-style:none;margin:0;padding:0;}
.pillar li{position:relative;padding:6px 0 6px 24px;font-size:14px;line-height:1.5;color:var(--ink2);}
.pillar.pos li:before{content:"\2713";position:absolute;left:0;color:var(--ok);font-weight:800;}
.pillar.neg li:before{content:"\2715";position:absolute;left:0;color:var(--bad);font-weight:800;}
.pillar li b{color:var(--ink);}
.recap{margin-top:40px;background:var(--grad);color:#fff;border-radius:18px;padding:24px 26px;}
.recap h3{margin:0 0 9px;font-family:var(--display);font-weight:900;font-size:22px;}
.recap p{margin:0;font-size:15.5px;line-height:1.6;color:rgba(255,255,255,.92);} .recap b{color:#fff;} .recap p+p{margin-top:12px;}

/* sections on the 3 to film */
.sec{scroll-margin-top:70px;}
.sec[id^="video-"]{margin-top:12px;border:1px solid var(--line);border-radius:20px;padding:6px 24px 24px;}
.sec[id^="video-"] h1{padding-top:18px;}
.divider{height:0;margin:28px 0;}
.roi{display:none;}
.pk{color:var(--ink2);font-size:14.5px;line-height:1.5;margin:0 0 12px;}

/* video cards */
.wins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;}
.win{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;transition:box-shadow .15s ease,transform .1s ease;}
.win:hover{box-shadow:0 8px 24px rgba(53,87,183,.16);}
.win img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 30%;background:var(--panel);}
.win .wb{padding:11px 12px 13px;}
.win .wtag{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:800;color:var(--violet);}
.win .wq{font-size:13.5px;line-height:1.42;color:var(--ink);font-weight:700;margin:6px 0 8px;}
.win .wm{font-size:12px;color:var(--ink2);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;}
.win .wm span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.win .wm b{color:var(--orange);font-size:13px;}
.win .wn{font-size:10.5px;line-height:1.35;color:var(--muted);margin-top:4px;letter-spacing:.3px;text-transform:uppercase;font-weight:700;}

/* the two ways to start */
.fork{display:flex;gap:12px;margin:2px 0 6px;}
.fork button{flex:1 1 0;min-width:0;text-align:left;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;transition:box-shadow .15s ease,transform .1s ease;}
.fork button:hover{box-shadow:0 8px 24px rgba(53,87,183,.14);}
.fork .fk{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--violet);}
.fork .ft{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.15;margin:8px 0 6px;letter-spacing:-.3px;}
.fork .fd{font-size:14.5px;line-height:1.5;color:var(--ink2);}
.fork .fg{align-self:flex-start;margin-top:auto;padding-top:14px;}
.fork .fg span{display:inline-block;font-size:14px;font-weight:700;color:var(--royal);}
.fork .primary{background:var(--grad);border:0;color:#fff;}
.fork .primary .fk,.fork .primary .fd{color:rgba(255,255,255,.88);}
.fork .primary .fg span{background:var(--cta);color:#fff;padding:10px 20px;border-radius:999px;}

/* audience picker, grouped */
.agroup{margin-top:22px;}
.agroup h3{font-family:var(--display);font-size:15px;font-weight:800;margin:0 0 10px;color:var(--ink);}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.acard{display:flex;flex-direction:column;text-align:left;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:box-shadow .15s ease,border-color .15s ease;}
.acard:hover{border-color:#B9C6EA;box-shadow:0 6px 18px rgba(53,87,183,.12);}
.acard .at{font-weight:700;font-size:15px;color:var(--ink);}
.acard .ad{font-size:13px;color:var(--ink2);margin-top:4px;line-height:1.4;}
.acard .ago{display:none;}
.apick-note{color:var(--ink2);font-size:14.5px;margin:0 0 6px;}

.stamp{display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px;background:#EEF8F2;border-radius:999px;padding:6px 14px;margin:4px 0 18px;font-size:12.5px;color:var(--ok);font-weight:700;}
.stamp i{width:8px;height:8px;border-radius:999px;background:#3FCF8E;flex:0 0 8px;font-style:normal;}
.stamp b{color:var(--ink2);font-weight:500;}
.amber.clickable{cursor:pointer;} .amber .go{display:block;margin-top:10px;font-size:12.5px;font-weight:800;color:var(--royal);}
.foot{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;line-height:1.5;}
.pending{margin-top:10px;color:var(--violet);font-weight:700;}
.loading{padding:40px 0;color:var(--ink2);font-size:15px;}

@media(min-width:1000px){
  .main .hooks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .sec[id^="video-"] .hooks{grid-template-columns:minmax(0,1fr);}
  .agrid{grid-template-columns:repeat(4,minmax(0,1fr));}
}
@media(max-width:760px){
  .band-in{padding:12px max(16px,env(safe-area-inset-left)) 12px max(16px,env(safe-area-inset-right));}
  .wordmark{font-size:18px;}
  .tabs{padding:9px max(16px,env(safe-area-inset-right)) 9px max(16px,env(safe-area-inset-left));}
  .main{padding:20px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left));}
  h1{font-size:30px;}
  .bigline{font-size:23px;}
  .sec[id^="video-"]{padding:4px 16px 18px;}
  .twocol,.fork{flex-direction:column;}
  .wins{grid-template-columns:repeat(2,minmax(0,1fr));}
}
</style></head>
<body>
<header class="band"><div class="band-in"><div><a class="wordmark" href="/">KENETIK</a><small>TikTok hook library</small></div><a class="backlink" href="/">← Creator Hub</a></div></header>
<nav class="nav"><div class="tabs" id="tabs"></div></nav>
<main class="main" id="main"><div class="loading">Loading the hooks.</div></main>
<script>
/* The hooks hub renders one file and holds no copy of its own.

   The content lives in the Kenetik Growth System at data/creator-flywheel/hooks-hub.json and is
   mirrored here as data/hooks-data.json by the publish workflow. Edit it there, never here: a
   hand edit to this page or to that file inside this repository is overwritten on the next
   publish. Everything below draws the file; nothing below decides anything.

   Tab order comes from nav_order, and a panel is addressed by its slug, so inserting or
   reordering a tab can never again point a button at the wrong panel. */

var DATA = null;

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* The store keeps emphasis as **bold**, because emphasis is meaning in this copy. */
function rich(s){
  return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}

function attr(s){ return esc(s); }

var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function inWords(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ''));
  if(!m) return '';
  return String(Number(m[3])) + ' ' + MONTHS[Number(m[2]) - 1] + ' ' + m[1];
}

function isFigure(v){ return typeof v === 'number' && isFinite(v); }

var COUNT_WORDS = ['no','one','two','three','four','five','six','seven','eight','nine','ten',
  'eleven','twelve'];
function inWordsCount(n){ return COUNT_WORDS[n] || String(n); }

/* How long the figures cover, in the page's own words, taken from the window the writer stamped
   on the top hooks block. One window, one sentence: the page never names a period of its own. */
function windowWeeks(){
  var w = (DATA.top_now || {}).window || {};
  var a = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(w.start || ''));
  var b = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(w.end || ''));
  if(!a || !b) return '';
  var days = Math.round((Date.parse(w.end) - Date.parse(w.start)) / 86400000) + 1;
  if(!(days > 0)) return '';
  var weeks = Math.round(days / 7);
  return weeks === 1 ? ' in the last week' : (' in the last ' + inWordsCount(weeks) + ' weeks');
}

/* THE ONE SENTENCE A FIGURE IS ALLOWED TO BE ON THIS PAGE (design direction §7): counts and
   multiples, never dollars. The store carries revenue for the console; nothing here reads it,
   and a test asserts this script never names that field. */
function proofWords(proof){
  var sold = proof.converting_videos;
  if(!isFigure(sold)) return null;
  if(sold === 0) return 'No sales off this line' + windowWeeks();
  var people = isFigure(proof.distinct_creators) && proof.distinct_creators > 0
    ? (' for ' + inWordsCount(proof.distinct_creators)
       + (proof.distinct_creators === 1 ? ' creator' : ' creators'))
    : '';
  return 'Sold ' + sold + (sold === 1 ? ' time' : ' times') + people + windowWeeks();
}

/* A tab may word a line it shares with another tab differently. One line keeps one id and one
   set of figures; the tab's own wording is applied on top of it here. */
function placedHook(tab, id){
  var base = (DATA.hooks || {})[id] || {};
  var row = {};
  for(var k in base){ if(Object.prototype.hasOwnProperty.call(base, k)) row[k] = base[k]; }
  var over = (tab.hook_overrides || {})[id] || {};
  for(var f in over){
    if(!Object.prototype.hasOwnProperty.call(over, f)) continue;
    if(over[f] === null){ delete row[f]; } else { row[f] = over[f]; }
  }
  return row;
}

function metaLine(hook){
  var parts = [];
  ['angle','format','audience'].forEach(function(f){ if(hook[f]) parts.push(rich(hook[f])); });
  (hook.meta_extra || []).forEach(function(part){
    if(part.kind === 'bold'){ parts.push('<b>' + esc(part.text) + '</b>'); }
    else if(part.kind === 'text'){ parts.push(esc(part.text)); }
    else if(part.kind === 'source_link'){
      var src = hook.source || {};
      if(src.link_label){
        parts.push('<a class="hsrc" href="' + attr(src.video_url) + '" target="_blank" rel="noopener">' + esc(src.link_label) + '</a>');
      }
    }
  });
  return parts.join(' &nbsp;&middot;&nbsp; ');
}

/* A quoted line whose own video is a card on this tab has been read: by that video. The proof
   figure counts only recent posts, so on a tab ranked over a longer window (the Top 10) it
   would say "not read yet" beside a card showing that same video's sales. The badge then says
   what the card says, from the same machine record, with its dates. */
function cardSales(blocks, videoId){
  for(var i = 0; i < (blocks || []).length; i++){
    var b = blocks[i];
    if(!b) continue;
    if(b.block === 'section'){
      var inner = cardSales(b.blocks, videoId);
      if(inner) return inner;
    }
    if(b.block !== 'wins') continue;
    for(var j = 0; j < (b.items || []).length; j++){
      var w = b.items[j];
      var m = /\/video\/(\d+)/.exec(String((w && w.url) || ''));
      if(m && m[1] === videoId && w.sales && typeof w.sales.figure === 'string') return w.sales;
    }
  }
  return null;
}

function cardWords(tab, src){
  if(!tab || !src || !src.euka_video_id) return null;
  var sales = cardSales(layoutFor(tab), String(src.euka_video_id));
  if(!sales) return null;
  var dates = sameWindow(sales.window, layoutWindow(layoutFor(tab))) ? '' : windowDates(sales.window);
  return 'Sold ' + sales.figure + (sales.note ? ' · ' + sales.note.replace(/^TikTok Shop · /, '') : '')
    + ' on TikTok Shop' + (dates ? ', ' + dates : '');
}

/* Small marks under every line, and all of them are honest.
   A line a creator said carries their name, and its sales when we have them for this window.
   A line no video has sold off yet says Untested, never a zero, and invites the reader to be
   the first: the videos that sell are the ones this page features. */
function badges(hook, tab){
  var src = hook.source || {};
  var proof = hook.proof || {};
  var out = [];
  var words = proofWords(proof) || cardWords(tab, src);
  if(src.kind === 'quoted'){
    var who = src.creator ? ('Said by ' + src.creator) : 'Said out loud';
    if(src.video_url){
      out.push('<a class="hbadge quoted" href="' + attr(src.video_url) + '" target="_blank" rel="noopener">' + esc(who) + '</a>');
    } else {
      out.push('<span class="hbadge quoted">' + esc(who) + '</span>');
    }
    if(words) out.push('<span class="hbadge">' + esc(words) + '</span>');
  } else if(words){
    out.push('<span class="hbadge">' + esc(words) + '</span>');
  } else {
    out.push('<span class="hbadge untested">Untested</span>'
      + '<span class="hprompt">Use this hook to be featured here</span>');
  }
  return '<div class="hbadges">' + out.join('') + '</div>';
}

function pad2(n){ return (n < 10 ? '0' : '') + n; }

function renderHooks(tab, ids){
  var rows = ids.map(function(id, i){
    var hook = placedHook(tab, id);
    var meta = metaLine(hook);
    return '<div class="hook"><div class="hnum">' + pad2(i + 1) + '</div><div class="hbody">'
      + '<div class="htxt">' + rich(hook.text) + '</div>'
      + (meta ? '<div class="hmeta">' + meta + '</div>' : '')
      + badges(hook, tab)
      + (hook.why ? '<div class="hwhy">' + rich(hook.why) + '</div>' : '')
      + '</div></div>';
  });
  return '<div class="hooks">' + rows.join('') + '</div>';
}

function renderFormula(steps){
  return '<div class="formula">' + (steps || []).map(function(step, i){
    return '<div class="step"><span class="sn">' + (i + 1) + '</span><div><b>' + rich(step.title)
      + '</b><p>' + rich(step.text) + '</p></div></div>';
  }).join('') + '</div>';
}

function renderPillar(side, pillar, fallback){
  var body;
  if(pillar && pillar.items){
    body = '<ul>' + pillar.items.map(function(li){ return '<li>' + rich(li) + '</li>'; }).join('') + '</ul>';
  } else if(pillar && typeof pillar.text === 'string'){
    body = '<p>' + rich(pillar.text) + '</p>';
  } else {
    body = '<ul>' + (fallback || []).map(function(li){ return '<li>' + rich(li) + '</li>'; }).join('') + '</ul>';
  }
  return '<div class="pillar ' + side + '"><h4>' + rich((pillar && pillar.heading) || '') + '</h4>' + body + '</div>';
}

/* A card's figure is the machine's when the card carries one (`sales`, that video's TikTok
   Shop sales over the turn's window, written weekly by the turn), and Nick's own figure when it
   does not. The tag, the quote and the handle are always his. A machine figure is drawn with
   the dates its own record covers. The store's gate refuses any figure on this page that is
   not TikTok Shop sales, and refuses a card that shows a figure with no dated record unless it
   is on the store's dated backlog, so nothing here needs to check either again. */
var SHORT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function windowDates(win){
  var a = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String((win || {}).start || ''));
  var b = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String((win || {}).end || ''));
  if(!a || !b) return '';
  var day = function(m, year){
    return String(Number(m[3])) + ' ' + SHORT_MONTHS[Number(m[2]) - 1] + (year ? ' ' + m[1] : '');
  };
  return day(a, a[1] !== b[1]) + ' to ' + day(b, true);
}

/* The one period a layout's machine cards cover, stated once in its stamp (Nick, 2026-10-06).
   The weekly turn writes every card over the same window, so a card is dated on its own only
   when its window differs from the one the stamp states: a card whose video the turn could not
   see keeps its older record, and says so. */
function sameWindow(a, b){ return !!a && !!b && a.start === b.start && a.end === b.end; }

function layoutWindow(blocks){
  var counts = [];
  (function walk(list){
    (list || []).forEach(function(b){
      if(!b) return;
      if(b.block === 'section'){ walk(b.blocks); return; }
      if(b.block !== 'wins') return;
      (b.items || []).forEach(function(w){
        var win = w && w.sales && typeof w.sales.figure === 'string' ? w.sales.window : null;
        if(!win || !windowDates(win)) return;
        for(var i = 0; i < counts.length; i++){
          if(sameWindow(counts[i].win, win)){ counts[i].n++; return; }
        }
        counts.push({win: win, n: 1});
      });
    });
  })(blocks);
  counts.sort(function(a, b){ return b.n - a.n; });
  return counts.length ? counts[0].win : null;
}

function renderWins(items, tabWindow){
  return '<div class="wins">' + (items || []).map(function(w){
    var sales = (w.sales && typeof w.sales.figure === 'string') ? w.sales : null;
    var figure = sales ? sales.figure : w.figure;
    var note = sales ? sales.note : w.note;
    var dates = sales && !sameWindow(sales.window, tabWindow) ? windowDates(sales.window) : '';
    return '<a class="win" href="' + attr(w.url) + '" target="_blank" rel="noopener">'
      + '<img src="' + attr(w.image) + '" alt="' + attr(w.image_alt) + '" loading="lazy">'
      + '<div class="wb"><div class="wtag">' + rich(w.tag) + '</div><div class="wq">' + rich(w.quote) + '</div>'
      + '<div class="wm"><span>' + esc(w.handle) + '</span><b>' + esc(figure) + '</b></div>'
      + (note ? '<div class="wn">' + esc(note) + '</div>' : '')
      + (dates ? '<div class="wn wd">' + esc(dates) + '</div>' : '')
      + '</div></a>';
  }).join('') + '</div>';
}

function renderFork(options){
  return '<div class="fork">' + (options || []).map(function(o){
    var go = o.target_slug ? ('openSlug(\'' + esc(o.target_slug) + '\')')
      : ('document.getElementById(\'' + esc(o.scroll_to || '') + '\').scrollIntoView({behavior:\'smooth\',block:\'start\'})');
    return '<button' + (o.primary ? ' class="primary"' : '') + ' onclick="' + attr(go) + '">'
      + '<div class="fk">' + rich(o.kicker) + '</div><div class="ft">' + rich(o.title) + '</div>'
      + '<div class="fd">' + rich(o.description) + '</div><div class="fg"><span>' + rich(o.go) + '</span></div></button>';
  }).join('') + '</div>';
}

/* The audience cards, in the groups the store names (`group` on each card), in the order the
   store lists them. A card with no group joins the one before it. */
function pickerGroups(cards){
  var groups = [];
  (cards || []).forEach(function(c){
    var name = c.group || (groups.length ? groups[groups.length - 1].name : '');
    var g = groups.length && groups[groups.length - 1].name === name ? groups[groups.length - 1] : null;
    if(!g){ g = {name: name, cards: []}; groups.push(g); }
    g.cards.push(c);
  });
  return groups;
}

function renderPicker(cards){
  return pickerGroups(cards).map(function(g){
    return '<div class="agroup">' + (g.name ? '<h3>' + rich(g.name) + '</h3>' : '')
      + '<div class="agrid">' + g.cards.map(function(c){
        return '<button class="acard" onclick="' + attr('openSlug(\'' + c.target_slug + '\')') + '">'
          + '<div class="at">' + rich(c.title) + '</div><div class="ad">' + rich(c.description) + '</div>'
          + '<div class="ago">' + rich(c.go) + '</div></button>';
      }).join('') + '</div></div>';
  }).join('');
}

/* The Start Here top hooks, written every turn by the machine from what actually sold (N1).
   Drawn on Start Here, which is where every TikTok Shop creator lands, and on the Top 3 tab.
   Until the writer fills the block this draws nothing and both tabs show their own hooks
   exactly as they do today. */
function renderTopNow(tab){
  var top = DATA.top_now || {};
  var rows = top.rows || [];
  if(!rows.length) return '';
  var window_ = top.window || {};
  var items = rows.map(function(r){
    var hook = placedHook(tab, r.hook_id);
    var figure = proofWords({converting_videos: r.converting_videos,
                             distinct_creators: r.creators}) || 'No sales counted yet';
    return '<li><b>' + rich(hook.text || r.hook_id) + '</b> ' + esc(figure) + '</li>';
  });
  return '<div class="eyebrow">Converting best right now</div>'
    + '<ul class="run">' + items.join('') + '</ul>'
    + '<p class="pk">' + esc(top.how || '') + (window_.start && window_.start !== 'UNKNOWN'
        ? esc(' Counted from ' + inWords(window_.start) + ' to ' + inWords(window_.end) + '.') : '') + '</p>';
}

/* The video formula sits under its own eyebrow on every audience tab, open by default (Nick,
   10/16: a closed fold read as a heading, not as something to tap). It can still be folded away. */
function isCoreTab(tab){ return CORE.indexOf(tab.slug) !== -1; }

function foldFormula(tab, blocks){
  if(isCoreTab(tab)) return blocks || [];
  var out = [];
  (blocks || []).forEach(function(b, i){
    var next = (blocks || [])[i + 1];
    if(b && b.block === 'eyebrow' && next && next.block === 'formula'){ return; }
    if(b && b.block === 'formula'){
      var prev = (blocks || [])[i - 1];
      out.push({block: 'howto', title: prev && prev.block === 'eyebrow' ? prev.text : '', steps: b.steps});
      return;
    }
    out.push(b);
  });
  return out;
}

function renderBlocks(tab, blocks, win){
  return foldFormula(tab, blocks).map(function(b){
    switch(b.block){
      case 'section':
        return '<div class="sec"' + (b.id ? ' id="' + attr(b.id) + '"' : '') + '>' + renderBlocks(tab, b.blocks, win) + '</div>';
      case 'heading':
        return '<h1>' + rich(b.title != null ? b.title : tab.title)
          + (b.roi ? ' <span class="roi">' + esc(b.roi) + '</span>' : '') + '</h1>';
      case 'sub':
        return '<div class="sub">' + rich(b.text != null ? b.text : tab.sub) + '</div>';
      case 'eyebrow':
        return '<div class="eyebrow"' + (b.id ? ' id="' + attr(b.id) + '"' : '') + '>' + rich(b.text) + '</div>';
      case 'northstar':
        if(b.style === 'big') return '<div class="bigline">' + rich(b.text) + '</div>';
        return '<div class="northstar"><p>' + rich(b.text != null ? b.text : tab.audience) + '</p></div>';
      case 'formula':
        return renderFormula(b.steps != null ? b.steps : tab.formula);
      case 'howto':
        return '<details class="howto" open><summary>' + rich(b.title) + '</summary>'
          + renderFormula(b.steps != null ? b.steps : tab.formula) + '</details>';
      case 'hooks':
        return renderHooks(tab, b.hook_ids || []);
      case 'twocol':
        return '<div class="twocol">' + renderPillar('pos', b.pos, tab.dos) + renderPillar('neg', b.neg, tab.donts) + '</div>';
      case 'amber': {
        /* A clickable callout is reachable by keyboard as well as by pointer, the way the page
           already does it: a role, a tab stop, and Enter or Space opening the same tab. */
        var open = b.target_slug ? attr('openSlug(\'' + b.target_slug + '\')') : '';
        var head = b.target_slug
          ? '<div class="amber clickable" role="button" tabindex="0" onclick="' + open
            + '" onkeydown="' + attr("if(event.key==='Enter'||event.key===' '){event.preventDefault();")
            + open + attr('}') + '">'
          : '<div class="amber">';
        return head + '<div class="amber-label">' + rich(b.label) + '</div><p>' + rich(b.text) + '</p>'
          + (b.go ? '<span class="go">' + rich(b.go) + '</span>' : '') + '</div>';
      }
      case 'stamp':
        return '<div class="stamp"><i></i>' + rich(b.text)
          + (win ? ' <b>· figures cover ' + esc(windowDates(win)) + '</b>' : '')
          + (b.note ? ' <b>' + rich(b.note) + '</b>' : '') + '</div>';
      case 'wins':
        return renderWins(b.items, win);
      case 'fork':
        return renderFork(b.options);
      case 'picker':
        return renderPicker(b.cards);
      case 'recap':
        return '<div class="recap"><h3>' + rich(b.heading) + '</h3>'
          + (b.paragraphs || []).map(function(p){ return '<p>' + rich(p) + '</p>'; }).join('') + '</div>';
      case 'note':
        return '<p class="' + attr(b.style || 'pk') + '">' + rich(b.text) + '</p>';
      case 'list':
        return '<ul class="run">' + (b.items || []).map(function(li){ return '<li>' + rich(li) + '</li>'; }).join('') + '</ul>';
      case 'divider':
        return '<div class="divider"></div>';
      case 'foot':
        return '';
      default:
        return '';
    }
  }).join('');
}

function renderFoot(){
  var pending = (DATA.changes_pending || []).length;
  var updated = inWords(DATA.updated);
  return '<div class="foot">' + rich(DATA.footer || '')
    + (updated ? ' Updated ' + esc(updated) + '.' : '')
    + (pending ? '<div class="pending">' + esc(pending + (pending === 1 ? ' change' : ' changes') + ' waiting on Nick') + '</div>' : '')
    + '</div>';
}

function layoutFor(tab){
  if(tab.layout_from === 'start_here'){ return (DATA.start_here || {}).layout || []; }
  return tab.layout || [];
}

/* The three tabs that are destinations of their own. Every other tab is an audience or a tool,
   reached from a picker page, which the page builds from Start Here's own picker blocks. */
var CORE = ['start-here', 'top-3', 'top-10-now'];
var AUDIENCES = 'audiences';

function stripEmoji(label){ return String(label || '').replace(/^[^A-Za-z0-9]+/, ''); }

/* Each picker block on Start Here, with the eyebrow and note above it, is a page of its own in
   the nav, in the order Start Here lists them. The first is the audience page, whose slug stays
   'audiences' so old links still land; a later one takes its eyebrow's id. */
function pickerPages(){
  var blocks = (DATA.start_here || {}).layout || [];
  var pages = [];
  blocks.forEach(function(b, i){
    if(b.block !== 'picker') return;
    var page = {picker: b, eyebrow: null, note: null};
    for(var k = i - 1; k >= 0 && blocks[k].block !== 'picker'; k--){
      if(blocks[k].block === 'note' && !page.note){ page.note = blocks[k]; }
      if(blocks[k].block === 'eyebrow'){ page.eyebrow = blocks[k]; break; }
    }
    page.slug = pages.length ? String((page.eyebrow && page.eyebrow.id) || 'picker-' + pages.length)
      .toLowerCase().replace(/[^a-z0-9-]/g, '') : AUDIENCES;
    page.title = page.eyebrow ? page.eyebrow.text : '';
    pages.push(page);
  });
  return pages;
}

/* The picker page a tab is reached from: the one whose cards open it, else the first. */
function pageFor(slug, pages){
  for(var i = 0; i < pages.length; i++){
    if(pages[i].slug === slug) return pages[i];
    if((pages[i].picker.cards || []).some(function(c){ return c.target_slug === slug; })) return pages[i];
  }
  return pages[0] || null;
}

function pickerPanel(page){
  return '<section class="panel" id="panel-' + attr(page.slug) + '" data-slug="' + attr(page.slug) + '">'
    + '<h1>' + rich(page.title) + '</h1>'
    + (page.note ? '<p class="apick-note">' + rich(page.note.text) + '</p>' : '')
    + renderPicker(page.picker.cards) + renderFoot() + '</section>';
}

function render(){
  var tabs = (DATA.tabs || []).slice().sort(function(a, b){ return a.nav_order - b.nav_order; });
  var pages = pickerPages();
  var nav = tabs.filter(function(t){ return CORE.indexOf(t.slug) !== -1; }).map(function(t){
    return '<button class="tab" data-for="' + attr(t.slug) + '" onclick="' + attr('openSlug(\'' + t.slug + '\')')
      + '"><span>' + esc(stripEmoji(t.label)) + '</span><em></em></button>';
  });
  pages.forEach(function(page){
    nav.push('<button class="tab" data-for="' + attr(page.slug) + '" onclick="' + attr('openSlug(\'' + page.slug + '\')')
      + '"><span>' + esc(page.title) + '</span><em></em></button>');
  });
  /* A nav link (a seasonal brief, say) sits right after Start Here, so a phone shows it without scrolling. It opens
     another hub page, so it is a link, never lit as the active tab. */
  var links = (DATA.nav_links || []).filter(function(l){ return /^\/[a-z0-9]/.test(l.href || ''); }).map(function(l){
    return '<a class="tab tab-link" href="' + attr(l.href) + '"><span>' + esc(l.label) + '</span></a>';
  });
  nav.splice.apply(nav, [Math.min(1, nav.length), 0].concat(links));
  document.getElementById('tabs').innerHTML = nav.join('');
  document.getElementById('main').innerHTML = tabs.map(function(t, i){
    var topNow = (t.slug === 'top-3' || t.slug === 'start-here') ? renderTopNow(t) : '';
    var home = CORE.indexOf(t.slug) === -1 ? pageFor(t.slug, pages) : null;
    var crumb = home ? '<button class="crumb" onclick="' + attr('openSlug(\'' + home.slug + '\')') + '">← '
      + esc(home.title) + '</button>' : '';
    var body = crumb + topNow + renderBlocks(t, layoutFor(t), layoutWindow(layoutFor(t))) + renderFoot();
    return '<section class="panel" id="panel' + i + '" data-slug="' + attr(t.slug) + '">'
      + '<div class="strip"></div>' + body + '</section>';
  }).join('') + pages.map(pickerPanel).join('');
}

/* One panel shows at a time. The nav lights the destination the panel belongs to: an audience
   or tool tab lights the picker page it is reached from. */
function showPanel(panel, slug){
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('show'); });
  panel.classList.add('show');
  var home = CORE.indexOf(slug) !== -1 || !slug ? null : pageFor(slug, pickerPages());
  var lit = home ? home.slug : slug;
  document.querySelectorAll('.tab').forEach(function(t){
    t.classList.toggle('active', t.getAttribute('data-for') === lit);
  });
  /* On a phone the nav scrolls sideways, so the lit destination is brought into view. */
  var on = document.querySelector('.tab.active');
  if(on && on.parentNode){ on.parentNode.scrollLeft = on.offsetLeft - on.parentNode.offsetLeft - 16; }
  if(slug && location.hash.replace('#', '') !== slug){ history.replaceState(null, '', '#' + slug); }
  window.scrollTo(0, 0);
}

function openSlug(slug){
  var panels = document.querySelectorAll('.panel');
  for(var i = 0; i < panels.length; i++){
    if(panels[i].getAttribute('data-slug') === slug){ showPanel(panels[i], slug); return; }
  }
}

function openFromHash(){
  var h = (location.hash || '').replace('#', '').toLowerCase();
  var panel = h && document.querySelector('.panel[data-slug="' + h.replace(/[^a-z0-9-]/g, '') + '"]');
  if(panel){ showPanel(panel, h); return; }
  var first = document.querySelector('.panel');
  if(first) showPanel(first, '');
}

function nudgeTabs(){}

fetch('../data/hooks-data.json', {cache:'no-cache'})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(json){
    DATA = json;
    render();
    openFromHash();
    nudgeTabs();
    window.addEventListener('hashchange', openFromHash);
  })
  .catch(function(){
    document.getElementById('main').innerHTML =
      '<div class="loading">The hooks did not load. Refresh the page, and if it keeps happening tell Nick.</div>';
  });
</script>
</body></html>
